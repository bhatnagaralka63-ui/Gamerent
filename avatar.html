<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Avatar - GameRent</title>

    <link rel="stylesheet" href="avatar.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="avatar-header">

        <button class="back-btn" onclick="history.back()">
            &#10094;
        </button>

        <h1>Edit Avatar</h1>

        <button class="done-btn" onclick="saveAvatar()">
            Done
        </button>

    </header>


    <!-- =========================
         CURRENT AVATAR
    ========================== -->

    <section class="profile-preview">

        <div class="current-avatar">

            <img
                id="currentAvatar"
                src="https://avatarfiles.alphacoders.com/343/thumb-1920-343468.png"
                alt="Current Avatar"
            >

        </div>

        <h2 id="profileName">Rudra</h2>

    </section>


    <!-- =========================
         ATTACK ON TITAN
    ========================== -->

    <section class="avatar-section">

        <h2>Attack on Titan</h2>

        <div class="avatar-grid">

            <!-- EREN -->
            <div class="avatar-card" onclick="selectAvatar(this)">
                <img
                    src="https://cdn.rafled.com/anime-icons/images/3296db81899c75960121abc62ed0fe492a1a87bdefdacaf8736d3336fb1422ed.jpg"
                    alt="Eren"
                >
                <span>Eren</span>
            </div>
