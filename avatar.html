<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Avatar | GameRent</title>

    <link rel="stylesheet" href="avatar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="avatar-header">

        <button class="back-btn" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h1>Edit Avatar</h1>

        <button class="done-btn" onclick="saveAvatar()">
            Done
        </button>

    </header>


    <!-- =========================
         PROFILE HERO
    ========================== -->

    <section class="profile-hero">

        <div class="hero-background"></div>

        <div class="profile-content">

            <div class="current-avatar">
                <img
                    id="currentAvatar"
                    src="images/avatar1.jpg"
                    alt="Current Avatar">
            </div>

            <h2 id="profileUsername">
                Rudra
            </h2>

        </div>

    </section>


    <!-- =========================
         AVATAR SELECTION
    ========================== -->

    <main class="avatar-container">


        <!-- ATTACK ON TITAN -->

        <section class="avatar-category">

            <h2>Attack on Titan</h2>

            <div class="avatar-grid">

                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/aot1.jpg')">

                    <img src="images/aot1.jpg" alt="Avatar">

                </div>


                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/aot2.jpg')">

                    <img src="images/aot2.jpg" alt="Avatar">

                </div>


                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/aot3.jpg')">

                    <img src="images/aot3.jpg" alt="Avatar">

                </div>

            </div>

        </section>



        <!-- BANANYA -->

        <section class="avatar-category">

            <h2>Bananya</h2>

            <div class="avatar-grid">

                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/bananya1.jpg')">

                    <img src="images/bananya1.jpg" alt="Avatar">

                </div>


                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/bananya2.jpg')">

                    <img src="images/bananya2.jpg" alt="Avatar">

                </div>


                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/bananya3.jpg')">

                    <img src="images/bananya3.jpg" alt="Avatar">

                </div>

            </div>

        </section>



        <!-- BLACK BUTLER -->

        <section class="avatar-category">

            <h2>Black Butler</h2>

            <div class="avatar-grid">

                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/blackbutler1.jpg')">

                    <img src="images/blackbutler1.jpg" alt="Avatar">

                </div>


                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/blackbutler2.jpg')">

                    <img src="images/blackbutler2.jpg" alt="Avatar">

                </div>


                <div class="avatar-option"
                    onclick="selectAvatar(this, 'images/blackbutler3.jpg')">

                    <img src="images/blackbutler3.jpg" alt="Avatar">

                </div>

            </div>

        </section>



        <!-- MORE CATEGORIES -->

        <section class="avatar-category">

            <h2>Anime</h2>

            <div class="avatar-grid">

                <div class="avatar-option">
                    <img src="images/avatar1.jpg" alt="Avatar">
                </div>

                <div class="avatar-option">
                    <img src="images/avatar2.jpg" alt="Avatar">
                </div>

                <div class="avatar-option">
                    <img src="images/avatar3.jpg" alt="Avatar">
                </div>

            </div>

        </section>


    </main>


    <script src="avatar.js"></script>

</body>

</html>
