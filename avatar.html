<!DOCTYPE html>
<html lang="en">
<head>
    <<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Avatar - GameRent</title>

    <link rel="stylesheet" href="avatar.css">
</head>

<body>

    <!-- HEADER -->
    <header class="avatar-header">

        <button class="back-btn" onclick="history.back()">
            &#10094;
        </button>

        <h1>Edit Avatar</h1>

        <button class="done-btn" onclick="saveAvatar()">
            Done
        </button>

    </header>


    <!-- CURRENT AVATAR -->
    <section class="profile-preview">

        <div class="current-avatar">
            <img
                id="currentAvatar"
                src="https://avatarfiles.alphacoders.com/343/thumb-1920-343468.png"
                alt="Current Avatar"
            >
        </div>

        <h2 id="profileName">Rudra</h2>

    </section>


    <!-- ATTACK ON TITAN -->
    <section class="avatar-section">

        <h2>Attack on Titan</h2>

        <div class="avatar-grid">

            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://avatarfiles.alphacoders.com/343/thumb-1920-343468.png"
                    alt="Levi"
                >
                <span>Levi</span>
            </div>


            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://cdn.pfps.gg/pfps/5355-levi-sunset.png"
                    alt="Levi"
                >
                <span>Levi</span>
            </div>


            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://c-ssl.dtstatic.com/uploads/blog/202012/23/20201223190551_ab01a.thumb.1000_0.jpg"
                    alt="Eren"
                >
                <span>Eren</span>
            </div>

        </div>

    </section>


    <!-- BLACK BUTLER -->
    <section class="avatar-section">

        <h2>Black Butler</h2>

        <div class="avatar-grid">

            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://i.pinimg.com/originals/aa/b0/43/aab0439da35411e92ab7cad1aec1915c.jpg"
                    alt="Ciel"
                >
                <span>Ciel</span>
            </div>

        </div>

    </section>


    <!-- BANANYA -->
    <section class="avatar-section">

        <h2>Bananya</h2>

        <div class="avatar-grid">

            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://i.pinimg.com/736x/cd/5b/47/cd5b47dcdf71276bd7f781d98e01505f.jpg"
                    alt="Bananya"
                >
                <span>Bananya</span>
            </div>

        </div>

    </section>

<script src="avatar.js"></script>
</body>
</html>
