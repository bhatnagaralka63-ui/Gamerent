<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Avatar | GameRent</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ================================
         TOP BAR
    ================================= -->

    <header class="avatar-header">

        <button class="back-btn"
                onclick="window.location.href='index.html'">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h1>Edit Avatar</h1>

        <button class="done-btn"
                onclick="saveAvatar()">

            Done

        </button>

    </header>


    <!-- ================================
         PROFILE PREVIEW
    ================================= -->

    <section class="avatar-profile">

        <div class="current-avatar">

            <img
                id="currentAvatar"
                src="https://i.pravatar.cc/300?img=12"
                alt="Current Avatar"
            >

        </div>

        <h2 id="currentName">
            Rudra
        </h2>

    </section>


    <!-- ================================
         AVATAR CATEGORIES
    ================================= -->

    <main class="avatar-container">


        <!-- ATTACK ON TITAN -->

        <section class="avatar-category">

            <h2>Attack on Titan</h2>

            <div class="avatar-grid">

                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=1"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>


                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=5"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>


                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=12"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>

            </div>

        </section>


        <!-- BANANYA -->

        <section class="avatar-category">

            <h2>Bananya</h2>

            <div class="avatar-grid">

                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=15"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>


                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=20"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>


                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=25"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>

            </div>

        </section>


        <!-- BLACK BUTLER -->

        <section class="avatar-category">

            <h2>Black Butler</h2>

            <div class="avatar-grid">

                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=2"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>


                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=8"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>


                <div class="avatar-option">

                    <img
                        src="https://i.pravatar.cc/300?img=11"
                        alt="Avatar"
                        onclick="selectAvatar(this.src)"
                    >

                </div>

            </div>

        </section>


    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>

        let selectedAvatar =
            localStorage.getItem("profileAvatar") ||
            "https://i.pravatar.cc/300?img=12";


        /* SHOW SAVED AVATAR */

        document.getElementById("currentAvatar").src =
            selectedAvatar;


        /* SELECT AVATAR */

        function selectAvatar(image) {

            selectedAvatar = image;

            document.getElementById("currentAvatar").src =
                image;

            document.querySelectorAll(".avatar-option")
                .forEach(option => {

                    option.classList.remove("selected");

                });

            event.currentTarget.parentElement
                .classList.add("selected");

        }


        /* SAVE AVATAR */

        function saveAvatar() {

            localStorage.setItem(
                "profileAvatar",
                selectedAvatar
            );

            window.location.href = "index.html";

        }

    </script>

</body>

</html>
