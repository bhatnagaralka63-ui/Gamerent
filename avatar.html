<!DOCTYPE html>
<html lang="en">
<head>
    <<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Avatar - GameRent</title>

    <link rel="stylesheet" href="avatar.css">
</head>

<body>

    <!-- HEADER -->
    <header class="avatar-header">

        <button class="back-btn" onclick="history.back()">
            &#10094;
        </button>

        <h1>Edit Avatar</h1>

        <button class="done-btn" onclick="saveAvatar()">
            Done
        </button>

    </header>


    <!-- CURRENT AVATAR -->
    <section class="profile-preview">

        <div class="current-avatar">
            <img
                id="currentAvatar"
                src="https://avatarfiles.alphacoders.com/343/thumb-1920-343468.png"
                alt="Current Avatar"
            >
        </div>

        <h2 id="profileName">Rudra</h2>

    </section>


    <!-- ATTACK ON TITAN -->
    <section class="avatar-section">

        <h2>Attack on Titan</h2>

        <div class="avatar-grid">
            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://wallpapers-clan.com/wp-content/uploads/2022/09/attack-on-titan-eren-pfp-10.jpg"
                    alt="Eren"
                >
                 <span>Eren</span>
            </div>
            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://i.pinimg.com/originals/8e/f6/7b/8ef67bcb60cd498924b16089268b0366.jpg"
                    alt="Mikasa"
                >
                <span>Mikasa</span>
            </div>
             

            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://wallpapers-clan.com/wp-content/uploads/2022/09/attack-on-titan-levi-pfp-13.jpg"
                    alt="Levi"
                >
                <span>Levi</span>
            </div>

        </div>
        <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://cdn.pfps.gg/pfps/7622-armin.png"
                    alt="Armin"
                >
                <span>Armin</span>
            </div>
    </section>
<section class="avatar-section">

    <h2>Black Butler</h2>

    <div class="avatar-grid">

        <!-- CIEL -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img src="https://i.pinimg.com/originals/aa/b0/43/aab0439da35411e92ab7cad1aec1915c.jpg"
                 alt="Ciel Phantomhive">
            <span>Ciel</span>
        </div>

        <!-- SEBASTIAN -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img src="https://i.pinimg.com/736x/bc/2d/df/bc2ddf5bf3fa6edb7a1723e41c41b82c.jpg"
                 alt="Sebastian Michaelis">
            <span>Sebastian</span>
        </div>

        <!-- GRELL -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img src="https://i.pinimg.com/736x/0d/7e/3b/0d7e3b6e0d7a8e6f7c3a9c5a8f5c8e4d.jpg"
                 alt="Grell Sutcliff">
            <span>Grell</span>
        </div>

        <!-- UNDERTAKER -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img src="https://i.pinimg.com/736x/8b/3d/6f/8b3d6f7c1a9c8e5d4f2b6a1e3c7d9f0a.jpg"
                 alt="Undertaker">
            <span>Undertaker</span>
        </div>

        <!-- ALOIS -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img src="https://i.pinimg.com/736x/2c/5f/91/2c5f91a7e3d8b4c6f0a2e9d5b7c1f3a8.jpg"
                 alt="Alois Trancy">
            <span>Alois</span>
        </div>

        <!-- CLAUDE -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img src="https://i.pinimg.com/736x/6a/4e/92/6a4e92b8c1d7f3a5e9c0b6d2f8a1e4c7.jpg"
                 alt="Claude Faustus">
            <span>Claude</span>
        </div>

    </div>
</section>

<!-- JJK -->
    <section class="avatar-section">

        <h2>JJK</h2>

        <div class="avatar-grid">

            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://pfpnook.com/wp-content/uploads/2026/06/Yuji-PFP-Anime-3.jpg"
                    alt="Yuji"
                >
                <span>Yuji</span>
            </div>
            <div class="avatar-grid">

            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://www.dpzone.in/wp-content/uploads/3/Megumi-PFP-16.jpg"
                    alt="Megumi"
                >
                <span>Megumi</span>
            </div>
                <div class="avatar-grid">

            <div class="avatar-card"
                 onclick="selectAvatar(this)">

                    src="https://i.pinimg.com/originals/37/55/a4/3755a4a8dc5acbdc291b51191b5a629b.jpg"
                    alt="Nobara"
                >
                <span>Nobara</span>
            </div>
                    <div class="avatar-grid">

            <div class="avatar-card"
                 onclick="selectAvatar(this)">
                <img
                    src="https://www.pngall.com/wp-content/uploads/14/Gojo-No-Background.png"
                    alt="Gojo"
                >
                <span>Gojo</span>
            </div>

        </div>

    </section>
    <section class="avatar-section">

    <h2>Bananya</h2>

    <div class="avatar-grid">

        <!-- Bananya -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img
                src="https://i.pinimg.com/736x/cd/5b/47/cd5b47dcdf71276bd7f781d98e01505f.jpg"
                alt="Bananya"
            >
            <span>Bananya</span>
        </div>

        <!-- Bananya with Glasses -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img
                src="https://bananya.jp/images/character/soukanzu_cha09.png"
                alt="Bananya"
            >
            <span>Bananya</span>
        </div>

        <!-- Siamese Bananya -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img
                src="https://static.zerochan.net/Siamese.Bananya.1024.3206386.webp"
                alt="Siamese Bananya"
            >
            <span>Siamese</span>
        </div>

        <!-- Sheriff Bananya -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img
                src="https://static.zerochan.net/Sheriff.Bananya.1024.3206388.webp"
                alt="Sheriff Bananya"
            >
            <span>Sheriff</span>
        </div>

        <!-- Ninja Bananya -->
        <div class="avatar-card" onclick="selectAvatar(this)">
            <img
                src="https://static.zerochan.net/Ninja.Bananya.1024.3206397.webp"
                alt="Ninja Bananya"
            >

    </div>
    </section>

<script src="avatar.js"></script>
</body>
</html>
